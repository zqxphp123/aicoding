{{define "layout"}}<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{.Title}} · 记账本</title>
<meta name="description" content="个人与工程记账，数据保存在本机。">
<meta name="theme-color" content="#0f766e">
<link rel="stylesheet" href="/static/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="记账本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body class="page-{{.Page}}">
<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.7 12 3.5l8.5 7.2"/><path d="M5.5 9.3V20h13V9.3"/><path d="M10 20v-5.2h4V20"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2"/><circle cx="4" cy="12" r="1.2"/><circle cx="4" cy="18" r="1.2"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3.5 7.5h6l2 2.2h9V19h-17z"/><path d="M3.5 7.5V5.2h6l2 2.3"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v3M12 18.2v3M21.2 12h-3M5.8 12h-3M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1M18.5 18.5l-2.1-2.1M7.6 7.6 5.5 5.5"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="/">
      <span class="brand-mark">账</span>
      <span class="brand-text">记账本</span>
    </a>
    <div class="topbar-right">
      <form method="post" action="/settings/book" class="book-switch">
        <select name="book_id" onchange="this.form.submit()" aria-label="切换账本">
          {{range .Books}}<option value="{{.ID}}" {{if eq .ID $.Book.ID}}selected{{end}}>{{.Name}}</option>{{end}}
        </select>
      </form>
      <a href="/settings" class="icon-btn mobile-only" aria-label="设置"><svg class="ico"><use href="#i-settings"/></svg></a>
      <a href="/tx/new" class="btn btn-primary btn-sm desktop-add">＋ 记一笔</a>
    </div>
  </div>
</header>

<div class="shell">
  <aside class="sidenav">
    <nav class="side-nav" aria-label="主导航">
      <a href="/" class="side-link {{if eq .Page "overview"}}active{{end}}"><svg class="ico"><use href="#i-home"/></svg><span>概览</span></a>
      <a href="/tx" class="side-link {{if eq .Page "tx"}}active{{end}}"><svg class="ico"><use href="#i-list"/></svg><span>流水</span></a>
      <a href="/projects" class="side-link {{if eq .Page "projects"}}active{{end}}"><svg class="ico"><use href="#i-folder"/></svg><span>项目</span></a>
      <a href="/reports" class="side-link {{if eq .Page "reports"}}active{{end}}"><svg class="ico"><use href="#i-chart"/></svg><span>报表</span></a>
      <a href="/settings" class="side-link {{if eq .Page "settings"}}active{{end}}"><svg class="ico"><use href="#i-settings"/></svg><span>设置</span></a>
    </nav>
    <div class="side-note">
      <div class="side-note-title">{{.Book.Name}}</div>
      <p>数据只存在这台电脑上</p>
      <a href="/settings">设置 · v{{.Version}}</a>
    </div>
  </aside>

  <main class="main">
    {{if .OK}}<div class="toast" data-toast>{{.OK}}</div>{{end}}
    {{template "content" .}}
  </main>
</div>

<nav class="tabbar" aria-label="底部导航">
  <a class="tab {{if eq .Page "overview"}}active{{end}}" href="/"><svg class="ico"><use href="#i-home"/></svg><span>概览</span></a>
  <a class="tab {{if eq .Page "tx"}}active{{end}}" href="/tx"><svg class="ico"><use href="#i-list"/></svg><span>流水</span></a>
  <a class="tab tab-add" href="/tx/new" aria-label="记一笔"><span class="tab-add-btn"><svg class="ico"><use href="#i-plus"/></svg></span><span>记一笔</span></a>
  <a class="tab {{if eq .Page "projects"}}active{{end}}" href="/projects"><svg class="ico"><use href="#i-folder"/></svg><span>项目</span></a>
  <a class="tab {{if eq .Page "reports"}}active{{end}}" href="/reports"><svg class="ico"><use href="#i-chart"/></svg><span>报表</span></a>
</nav>

<script src="/static/charts.js"></script>
<script src="/static/app.js"></script>
</body>
</html>{{end}}
